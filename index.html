<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no
    ">

  <title>
    MHSI Inventory Scanner
  </title>


  <script
    src="https://accounts.google.com/gsi/client"
    async
    defer>
  </script>


  <script
    src="https://unpkg.com/@zxing/browser@latest">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background:
        #f3f6fb;

      color:
        #172033;

    }


    .header {

      background:
        linear-gradient(
          135deg,
          #1555b6,
          #3277df
        );

      color:
        white;

      padding:
        25px 20px;

    }


    .header h1 {

      margin: 0;

      font-size:
        24px;

    }


    .header p {

      margin:
        6px 0 0;

      opacity:
        .9;

      font-size:
        13px;

    }


    .container {

      max-width:
        650px;

      margin:
        auto;

      padding:
        16px;

    }


    .card {

      background:
        white;

      border-radius:
        20px;

      padding:
        18px;

      margin-bottom:
        15px;

      box-shadow:
        0 4px 18px
        rgba(
          0,
          0,
          0,
          .055
        );

    }


    .hidden {

      display:
        none !important;

    }


    /* LOGIN */


    .login-card {

      text-align:
        center;

      padding:
        32px 20px;

    }


    .login-icon {

      font-size:
        50px;

      margin-bottom:
        12px;

    }


    .login-title {

      font-size:
        22px;

      font-weight:
        800;

      margin-bottom:
        8px;

    }


    .login-text {

      color:
        #667085;

      font-size:
        13px;

      line-height:
        1.55;

      margin-bottom:
        22px;

    }


    #googleButton {

      display:
        flex;

      justify-content:
        center;

    }


    /* USER */


    .user-top {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap:
        12px;

    }


    .user-name {

      font-size:
        18px;

      font-weight:
        800;

    }


    .user-meta {

      margin-top:
        4px;

      color:
        #667085;

      font-size:
        12px;

      line-height:
        1.5;

    }


    .permission-list {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        6px;

      margin-top:
        12px;

    }


    .permission {

      background:
        #edf4ff;

      color:
        #2764c5;

      padding:
        6px 9px;

      border-radius:
        20px;

      font-size:
        10px;

      font-weight:
        800;

    }


    /* STATUS */


    .status {

      padding:
        13px 15px;

      border-radius:
        13px;

      margin-bottom:
        15px;

      font-size:
        13px;

      line-height:
        1.5;

    }


    .info {

      background:
        #edf4ff;

      color:
        #2459a9;

    }


    .success {

      background:
        #e8f7ee;

      color:
        #166534;

    }


    .error {

      background:
        #fff0f0;

      color:
        #b42318;

    }


    .warning {

      background:
        #fff7e8;

      color:
        #945b00;

    }


    /* CAMERA */


    .camera-shell {

      position:
        relative;

      overflow:
        hidden;

      background:
        #111;

      border-radius:
        16px;

    }


    #video {

      display:
        block;

      width:
        100%;

      height:
        330px;

      object-fit:
        cover;

      background:
        #111;

    }


    .scan-frame {

      position:
        absolute;

      left:
        7%;

      right:
        7%;

      top:
        34%;

      height:
        32%;

      border:
        2px solid
        rgba(
          255,
          255,
          255,
          .9
        );

      border-radius:
        12px;

      pointer-events:
        none;

    }


    .scan-line {

      position:
        absolute;

      left:
        10%;

      right:
        10%;

      top:
        50%;

      height:
        2px;

      background:
        white;

      pointer-events:
        none;

    }


    /* BUTTON */


    button {

      width:
        100%;

      border:
        0;

      border-radius:
        12px;

      padding:
        14px 16px;

      margin-top:
        10px;

      font-size:
        15px;

      font-weight:
        800;

      cursor:
        pointer;

    }


    .primary {

      background:
        #2d6ed5;

      color:
        white;

    }


    .secondary {

      background:
        #edf4ff;

      color:
        #2764c5;

    }


    .receive {

      background:
        #15805b;

      color:
        white;

    }


    .logout {

      width:
        auto;

      margin:
        0;

      padding:
        10px 13px;

      background:
        #fff0f0;

      color:
        #b42318;

    }


    /* FORMS */


    input,
    select,
    textarea {

      width:
        100%;

      border:
        1px solid
        #d7dee8;

      border-radius:
        12px;

      padding:
        13px;

      font-size:
        16px;

      background:
        white;

      margin-bottom:
        13px;

    }


    label {

      display:
        block;

      margin-bottom:
        5px;

      color:
        #667085;

      font-size:
        12px;

      font-weight:
        800;

    }


    .required {

      color:
        #b42318;

    }


    .manual-row {

      display:
        grid;

      grid-template-columns:
        1fr auto;

      gap:
        8px;

    }


    .manual-row input {

      margin: 0;

    }


    .manual-row button {

      width:
        auto;

      min-width:
        90px;

      margin:
        0;

    }


    /* ITEM */


    .section-title {

      color:
        #687386;

      font-size:
        11px;

      font-weight:
        800;

      margin-bottom:
        8px;

    }


    .item-code {

      color:
        #687386;

      font-size:
        12px;

      font-weight:
        700;

    }


    .item-name {

      margin-top:
        5px;

      font-size:
        23px;

      font-weight:
        800;

    }


    .item-details {

      margin-top:
        11px;

      color:
        #667085;

      font-size:
        13px;

      line-height:
        1.7;

    }


    .stock-grid {

      display:
        grid;

      grid-template-columns:
        repeat(
          3,
          1fr
        );

      gap:
        8px;

      margin-top:
        16px;

    }


    .stock-box {

      background:
        #f5f8fc;

      border-radius:
        14px;

      padding:
        14px 5px;

      text-align:
        center;

    }


    .stock-number {

      color:
        #2868c9;

      font-size:
        23px;

      font-weight:
        800;

    }


    .stock-label {

      margin-top:
        3px;

      color:
        #697386;

      font-size:
        9px;

      font-weight:
        800;

    }


    .level {

      margin-top:
        14px;

      border-radius:
        12px;

      padding:
        12px;

      font-size:
        12px;

      font-weight:
        700;

    }


    .level-good {

      background:
        #ebf8ef;

      color:
        #166534;

    }


    .level-reorder {

      background:
        #fff7e8;

      color:
        #945b00;

    }


    .level-critical {

      background:
        #fff0f0;

      color:
        #b42318;

    }


    .batch-heading {

      margin-top:
        19px;

      color:
        #687386;

      font-size:
        11px;

      font-weight:
        800;

    }


    .batch {

      padding:
        11px 0;

      border-top:
        1px solid
        #edf0f4;

      font-size:
        12px;

      line-height:
        1.6;

    }


    /* RECEIVE */


    .receive-title {

      font-size:
        21px;

      font-weight:
        800;

      margin-bottom:
        5px;

    }


    .receive-item {

      color:
        #667085;

      font-size:
        13px;

      margin-bottom:
        18px;

    }


    /* LOADING */


    .loading {

      position:
        fixed;

      inset:
        0;

      z-index:
        9999;

      background:
        rgba(
          255,
          255,
          255,
          .93
        );

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

      align-items:
        center;

      color:
        #2868c9;

      font-weight:
        800;

    }


    .spinner {

      width:
        38px;

      height:
        38px;

      border:
        4px solid
        #dce8f8;

      border-top-color:
        #2868c9;

      border-radius:
        50%;

      margin-bottom:
        12px;

      animation:
        spin .8s linear
        infinite;

    }


    @keyframes spin {

      to {

        transform:
          rotate(360deg);

      }

    }

  </style>

</head>


<body>


<div
  id="loading"
  class="loading hidden">

  <div class="spinner"></div>

  <div id="loadingText">
    Loading...
  </div>

</div>


<header class="header">

  <h1>
    MHSI Inventory Scanner
  </h1>

  <p>
    Secure Inventory Management
  </p>

</header>


<main class="container">


  <!-- LOGIN -->


  <div
    id="loginCard"
    class="card login-card">

    <div class="login-icon">
      🔐
    </div>

    <div class="login-title">
      Sign in to IMS
    </div>

    <div class="login-text">

      Sign in using your authorized
      MHSI Google account.

    </div>

    <div id="googleButton"></div>

  </div>


  <!-- APPLICATION -->


  <div
    id="appArea"
    class="hidden">


    <!-- USER -->


    <div class="card">

      <div class="user-top">

        <div>

          <div
            id="userName"
            class="user-name">
          </div>

          <div
            id="userMeta"
            class="user-meta">
          </div>

        </div>


        <button
          class="logout"
          onclick="logout()">

          LOG OUT

        </button>

      </div>


      <div
        id="permissionList"
        class="permission-list">
      </div>

    </div>


    <!-- STATUS -->


    <div
      id="statusBox"
      class="status info">

      Ready to scan.

    </div>


    <!-- SCANNER -->


    <div class="card">

      <div class="camera-shell">

        <video
          id="video"
          autoplay
          muted
          playsinline>
        </video>

        <div class="scan-frame"></div>

        <div class="scan-line"></div>

      </div>


      <button
        id="openButton"
        class="primary"
        onclick="openScanner()">

        OPEN SCANNER

      </button>


      <button
        id="stopButton"
        class="secondary hidden"
        onclick="stopScanner()">

        STOP SCANNER

      </button>

    </div>


    <!-- MANUAL SEARCH -->


    <div class="card">

      <div class="section-title">
        MANUAL SEARCH
      </div>


      <div class="manual-row">

        <input
          id="manualCode"
          type="text"
          placeholder="Barcode / Item ID">


        <button
          class="primary"
          onclick="manualLookup()">

          SEARCH

        </button>

      </div>

    </div>


    <!-- ITEM -->


    <div
      id="itemCard"
      class="card hidden">


      <div
        id="itemCode"
        class="item-code">
      </div>


      <div
        id="itemName"
        class="item-name">
      </div>


      <div
        id="itemDetails"
        class="item-details">
      </div>


      <div class="stock-grid">


        <div class="stock-box">

          <div
            id="availableStock"
            class="stock-number">
            0
          </div>

          <div class="stock-label">
            AVAILABLE
          </div>

        </div>


        <div class="stock-box">

          <div
            id="quarantineStock"
            class="stock-number">
            0
          </div>

          <div class="stock-label">
            QUARANTINE
          </div>

        </div>


        <div class="stock-box">

          <div
            id="transitStock"
            class="stock-number">
            0
          </div>

          <div class="stock-label">
            IN TRANSIT
          </div>

        </div>


      </div>


      <div
        id="stockLevel"
        class="level hidden">
      </div>


      <div id="batchContainer"></div>


      <button
        id="receiveButton"
        class="receive hidden"
        onclick="openReceive()">

        + RECEIVE STOCK

      </button>


      <button
        class="primary"
        onclick="scanAnother()">

        SCAN ANOTHER ITEM

      </button>


    </div>


    <!-- RECEIVE FORM -->


    <div
      id="receiveCard"
      class="card hidden">


      <div class="receive-title">
        Receive Stock
      </div>


      <div
        id="receiveItemName"
        class="receive-item">
      </div>


      <label>

        Quantity
        <span class="required">*</span>

      </label>


      <input
        id="receiveQty"
        type="number"
        min="0.01"
        step="0.01"
        inputmode="decimal"
        placeholder="Quantity received">


      <label>

        Batch / Lot Number

        <span
          id="batchRequired"
          class="required">
        </span>

      </label>


      <input
        id="receiveBatch"
        type="text"
        placeholder="Batch / Lot Number">


      <label>

        Expiry Date

        <span
          id="expiryRequired"
          class="required">
        </span>

      </label>


      <input
        id="receiveExpiry"
        type="date">


      <label>

        Storage Location
        <span class="required">*</span>

      </label>


      <select
        id="receiveLocation">

        <option value="">
          Select location
        </option>

      </select>


      <label>
        Unit Cost
      </label>


      <input
        id="receiveUnitCost"
        type="number"
        min="0"
        step="0.01"
        inputmode="decimal"
        placeholder="Optional">


      <label>
        Reference No.
      </label>


      <input
        id="receiveReference"
        type="text"
        maxlength="100"
        placeholder="PO / DR / Delivery Reference">


      <label>
        Notes
      </label>


      <textarea
        id="receiveNotes"
        rows="3"
        maxlength="300"
        placeholder="Optional notes">
      </textarea>


      <button
        class="receive"
        onclick="submitReceive()">

        CONFIRM RECEIVE

      </button>


      <button
        class="secondary"
        onclick="closeReceive()">

        CANCEL

      </button>


    </div>


  </div>


</main>


<script>


/* =========================================================
   CONFIG
========================================================= */


const GOOGLE_CLIENT_ID =
  '717366343479-qjs60uj0gumr9m326phdtjp5kp0o6vrq.apps.googleusercontent.com';


const API_URL =
  'https://script.google.com/macros/s/AKfycbwSGG51EMk-47M9QqAfGUosXfslYvrq8MB6sSdVAO8NMFKL3YjzDsLXoLxsO-JvbMKwCA/exec';



/* =========================================================
   STATE
========================================================= */


let sessionToken =
  localStorage.getItem(
    'mhsi_ims_session'
  ) || '';


let currentUser =
  null;


let currentItemResult =
  null;


let locations =
  [];


let codeReader =
  null;


let controls =
  null;


let scannerRunning =
  false;


let scanLocked =
  false;



/* =========================================================
   INITIALIZE
========================================================= */


window.addEventListener(
  'load',
  initialize
);


function initialize() {


  if (sessionToken) {

    validateStoredSession();

  }


  const timer =
    setInterval(
      function() {

        if (
          window.google &&
          google.accounts &&
          google.accounts.id
        ) {

          clearInterval(
            timer
          );

          initializeGoogleLogin();

        }

      },
      100
    );

}



/* =========================================================
   GOOGLE LOGIN
========================================================= */


function initializeGoogleLogin() {


  google.accounts.id.initialize({

    client_id:
      GOOGLE_CLIENT_ID,

    callback:
      handleGoogleCredential,

    auto_select:
      false

  });


  google.accounts.id.renderButton(

    document
      .getElementById(
        'googleButton'
      ),

    {

      theme:
        'outline',

      size:
        'large',

      width:
        280,

      text:
        'signin_with'

    }

  );

}


function handleGoogleCredential(
  response
) {


  if (
    !response ||
    !response.credential
  ) {

    alert(
      'Google sign-in failed.'
    );

    return;

  }


  showLoading(
    'Verifying MHSI account...'
  );


  apiCall(
    'login',

    {
      credential:
        response.credential
    },

    function(result) {


      hideLoading();


      if (
        !result ||
        result.success !== true
      ) {

        alert(
          result &&
          result.message
            ? result.message
            : 'Access denied.'
        );

        return;

      }


      sessionToken =
        result.sessionToken;


      localStorage.setItem(
        'mhsi_ims_session',
        sessionToken
      );


      currentUser =
        result.user;


      openApp();

    }

  );

}



/* =========================================================
   SESSION
========================================================= */


function validateStoredSession() {


  apiCall(
    'session',

    {
      session:
        sessionToken
    },

    function(result) {


      if (
        result &&
        result.success === true &&
        result.authenticated === true
      ) {

        currentUser =
          result.user;


        openApp();

      }

      else {

        clearSession();

      }

    }

  );

}


function openApp() {


  document
    .getElementById(
      'loginCard'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'appArea'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'userName'
    )
    .textContent =
      currentUser.fullName;


  document
    .getElementById(
      'userMeta'
    )
    .innerHTML =

      escapeHtml(
        currentUser.role
      ) +

      '<br>' +

      escapeHtml(
        currentUser.pccName ||
        currentUser.pccId
      ) +

      ' • ' +

      escapeHtml(
        currentUser.email
      );


  renderPermissions();


  loadLocations();


  showStatus(
    'Signed in successfully. Ready to scan.',
    'success'
  );

}



/* =========================================================
   PERMISSIONS
========================================================= */


function renderPermissions() {


  const permissions =
    currentUser.permissions || {};


  const labels = [];


  if (
    permissions.receive
  ) {

    labels.push(
      'RECEIVE'
    );

  }


  if (
    permissions.issue
  ) {

    labels.push(
      'ISSUE'
    );

  }


  if (
    permissions.transfer
  ) {

    labels.push(
      'TRANSFER'
    );

  }


  if (
    permissions.count
  ) {

    labels.push(
      'COUNT'
    );

  }


  document
    .getElementById(
      'permissionList'
    )
    .innerHTML =

      labels.map(
        function(label) {

          return (
            '<span class="permission">' +
            escapeHtml(
              label
            ) +
            '</span>'
          );

        }
      )
      .join('');

}



/* =========================================================
   LOGOUT
========================================================= */


function logout() {


  stopScanner();


  if (sessionToken) {

    apiCall(
      'logout',

      {
        session:
          sessionToken
      },

      function() {}

    );

  }


  try {

    google.accounts.id
      .disableAutoSelect();

  }

  catch (error) {}


  clearSession();


  location.reload();

}


function clearSession() {


  sessionToken = '';

  currentUser = null;

  currentItemResult = null;


  localStorage.removeItem(
    'mhsi_ims_session'
  );

}



/* =========================================================
   LOCATIONS
========================================================= */


function loadLocations() {


  apiCall(
    'locations',

    {
      session:
        sessionToken
    },

    function(result) {


      if (
        !result ||
        result.success !== true
      ) {

        return;

      }


      locations =
        result.locations || [];


      renderLocationDropdown();

    }

  );

}


function renderLocationDropdown() {


  const select =
    document
      .getElementById(
        'receiveLocation'
      );


  select.innerHTML =

    '<option value="">' +
    'Select location' +
    '</option>';


  locations.forEach(
    function(location) {


      const option =
        document
          .createElement(
            'option'
          );


      option.value =
        location.locationId;


      option.textContent =

        location.locationName +

        (
          location.locationType
            ? ' • ' +
              location.locationType
            : ''
        );


      select.appendChild(
        option
      );

    }
  );

}



/* =========================================================
   CAMERA
========================================================= */


async function openScanner() {


  if (
    scannerRunning ||
    !sessionToken
  ) {

    return;

  }


  scanLocked = false;


  try {


    codeReader =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    const devices =
      await ZXingBrowser
        .BrowserCodeReader
        .listVideoInputDevices();


    if (
      !devices ||
      !devices.length
    ) {

      throw new Error(
        'No camera detected.'
      );

    }


    let selected =
      devices[0];


    const rear =
      devices.find(
        function(device) {


          const label =
            String(
              device.label || ''
            )
            .toLowerCase();


          return (

            label.includes(
              'back'
            ) ||

            label.includes(
              'rear'
            ) ||

            label.includes(
              'environment'
            )

          );

        }
      );


    if (rear) {

      selected = rear;

    }


    controls =
      await codeReader
        .decodeFromVideoDevice(

          selected.deviceId,

          document
            .getElementById(
              'video'
            ),

          function(result) {


            if (
              result &&
              !scanLocked
            ) {


              const value =
                String(
                  result.getText()
                )
                .trim();


              if (value) {

                handleScannedCode(
                  value
                );

              }

            }

          }

        );


    scannerRunning =
      true;


    document
      .getElementById(
        'openButton'
      )
      .classList.add(
        'hidden'
      );


    document
      .getElementById(
        'stopButton'
      )
      .classList.remove(
        'hidden'
      );


    showStatus(
      'Camera ready.',
      'success'
    );

  }

  catch (error) {


    showStatus(
      error.message ||
      String(error),
      'error'
    );

  }

}


async function stopScanner() {


  try {

    if (controls) {

      controls.stop();

    }

  }

  catch (error) {}


  controls =
    null;


  codeReader =
    null;


  scannerRunning =
    false;


  const video =
    document
      .getElementById(
        'video'
      );


  if (
    video &&
    video.srcObject
  ) {

    video.srcObject
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    video.srcObject =
      null;

  }


  document
    .getElementById(
      'openButton'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'stopButton'
    )
    .classList.add(
      'hidden'
    );

}


async function handleScannedCode(
  value
) {


  if (scanLocked) {

    return;

  }


  scanLocked =
    true;


  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      100
    );

  }


  await stopScanner();


  lookupInventory(
    value
  );

}



/* =========================================================
   LOOKUP
========================================================= */


function manualLookup() {


  const value =
    document
      .getElementById(
        'manualCode'
      )
      .value
      .trim();


  if (!value) {

    showStatus(
      'Enter a Barcode or Item ID.',
      'error'
    );

    return;

  }


  lookupInventory(
    value
  );

}


function lookupInventory(
  code
) {


  showLoading(
    'Looking up inventory...'
  );


  apiCall(
    'lookup',

    {
      session:
        sessionToken,

      code:
        code
    },

    function(result) {


      hideLoading();


      if (
        !result
      ) {

        showStatus(
          'No response from IMS.',
          'error'
        );


        scanLocked =
          false;


        return;

      }


      if (
        result.authenticated ===
        false
      ) {

        sessionExpired();

        return;

      }


      if (
        result.success !== true
      ) {

        showStatus(
          result.message ||
          'IMS lookup failed.',
          'error'
        );


        scanLocked =
          false;


        return;

      }


      if (
        result.found !== true
      ) {

        document
          .getElementById(
            'itemCard'
          )
          .classList.add(
            'hidden'
          );


        showStatus(
          'Item not found in ITEM_MASTER.',
          'warning'
        );


        scanLocked =
          false;


        return;

      }


      currentItemResult =
        result;


      displayItem(
        result
      );


      scanLocked =
        false;

    }

  );

}



/* =========================================================
   DISPLAY ITEM
========================================================= */


function displayItem(
  result
) {


  const item =
    result.item;


  const inventory =
    result.inventory;


  document
    .getElementById(
      'itemCard'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'itemCode'
    )
    .textContent =

      item.itemId +

      (
        item.barcode
          ? ' • ' +
            item.barcode
          : ''
      );


  document
    .getElementById(
      'itemName'
    )
    .textContent =
      item.itemName;


  document
    .getElementById(
      'itemDetails'
    )
    .innerHTML =

      'Category: <b>' +
      escapeHtml(
        item.category || '-'
      ) +
      '</b><br>' +

      'UOM: <b>' +
      escapeHtml(
        item.uom || '-'
      ) +
      '</b>' +

      (
        item.brand
          ? '<br>Brand: <b>' +
            escapeHtml(
              item.brand
            ) +
            '</b>'
          : ''
      );


  document
    .getElementById(
      'availableStock'
    )
    .textContent =
      inventory.totalAvailable;


  document
    .getElementById(
      'quarantineStock'
    )
    .textContent =
      inventory.totalQuarantined;


  document
    .getElementById(
      'transitStock'
    )
    .textContent =
      inventory.totalInTransit;


  renderThreshold(
    inventory.totalAvailable,
    result.threshold
  );


  renderBatches(
    inventory.batches || []
  );


  const receiveButton =
    document
      .getElementById(
        'receiveButton'
      );


  if (
    currentUser &&
    currentUser.permissions &&
    currentUser.permissions.receive
  ) {

    receiveButton
      .classList.remove(
        'hidden'
      );

  }

  else {

    receiveButton
      .classList.add(
        'hidden'
      );

  }


  showStatus(
    'Item found.',
    'success'
  );


  document
    .getElementById(
      'itemCard'
    )
    .scrollIntoView({

      behavior:
        'smooth',

      block:
        'start'

    });

}



/* =========================================================
   RECEIVE FORM
========================================================= */


function openReceive() {


  if (
    !currentItemResult
  ) {

    return;

  }


  const item =
    currentItemResult.item;


  clearReceiveForm();


  document
    .getElementById(
      'receiveItemName'
    )
    .textContent =

      item.itemName +
      ' • ' +
      item.itemId;


  document
    .getElementById(
      'batchRequired'
    )
    .textContent =

      item.requiresBatch
        ? '*'
        : '';


  document
    .getElementById(
      'expiryRequired'
    )
    .textContent =

      item.requiresExpiry
        ? '*'
        : '';


  /*
    Auto-select preferred
    stockroom if configured.
  */

  if (
    currentItemResult.threshold &&
    currentItemResult.threshold
      .preferredLocationId
  ) {

    document
      .getElementById(
        'receiveLocation'
      )
      .value =

        currentItemResult
          .threshold
          .preferredLocationId;

  }


  document
    .getElementById(
      'receiveCard'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'receiveCard'
    )
    .scrollIntoView({

      behavior:
        'smooth',

      block:
        'start'

    });

}


function closeReceive() {


  document
    .getElementById(
      'receiveCard'
    )
    .classList.add(
      'hidden'
    );

}


function clearReceiveForm() {


  document
    .getElementById(
      'receiveQty'
    )
    .value = '';


  document
    .getElementById(
      'receiveBatch'
    )
    .value = '';


  document
    .getElementById(
      'receiveExpiry'
    )
    .value = '';


  document
    .getElementById(
      'receiveLocation'
    )
    .value = '';


  document
    .getElementById(
      'receiveUnitCost'
    )
    .value = '';


  document
    .getElementById(
      'receiveReference'
    )
    .value = '';


  document
    .getElementById(
      'receiveNotes'
    )
    .value = '';

}



/* =========================================================
   SUBMIT RECEIVE
========================================================= */


function submitReceive() {


  if (
    !currentItemResult
  ) {

    return;

  }


  const item =
    currentItemResult.item;


  const quantity =
    Number(
      document
        .getElementById(
          'receiveQty'
        )
        .value
    );


  const batchNo =
    document
      .getElementById(
        'receiveBatch'
      )
      .value
      .trim();


  const expiryDate =
    document
      .getElementById(
        'receiveExpiry'
      )
      .value;


  const locationId =
    document
      .getElementById(
        'receiveLocation'
      )
      .value;


  const unitCost =
    Number(
      document
        .getElementById(
          'receiveUnitCost'
        )
        .value || 0
    );


  const referenceNo =
    document
      .getElementById(
        'receiveReference'
      )
      .value
      .trim();


  const notes =
    document
      .getElementById(
        'receiveNotes'
      )
      .value
      .trim();


  if (
    !quantity ||
    quantity <= 0
  ) {

    alert(
      'Enter a valid quantity.'
    );

    return;

  }


  if (
    item.requiresBatch &&
    !batchNo
  ) {

    alert(
      'Batch / Lot Number is required.'
    );

    return;

  }


  if (
    item.requiresExpiry &&
    !expiryDate
  ) {

    alert(
      'Expiry Date is required.'
    );

    return;

  }


  if (!locationId) {

    alert(
      'Select a storage location.'
    );

    return;

  }


  if (
    !Number.isFinite(
      unitCost
    ) ||
    unitCost < 0
  ) {

    alert(
      'Invalid unit cost.'
    );

    return;

  }


  const confirmed =
    confirm(

      'Receive ' +
      quantity +
      ' ' +
      (
        item.uom || ''
      ) +
      ' of ' +
      item.itemName +
      '?'

    );


  if (!confirmed) {

    return;

  }


  const requestId =
    generateRequestId();


  showLoading(
    'Receiving stock...'
  );


  apiCall(
    'receive',

    {

      session:
        sessionToken,

      requestId:
        requestId,

      itemId:
        item.itemId,

      quantity:
        quantity,

      batchNo:
        batchNo,

      expiryDate:
        expiryDate,

      locationId:
        locationId,

      unitCost:
        unitCost,

      referenceNo:
        referenceNo,

      notes:
        notes

    },

    function(result) {


      hideLoading();


      if (!result) {

        alert(
          'No response from IMS.'
        );

        return;

      }


      if (
        result.authenticated ===
        false
      ) {

        sessionExpired();

        return;

      }


      if (
        result.success !== true
      ) {

        alert(
          result.message ||
          'Receive transaction failed.'
        );

        return;

      }


      const transaction =
        result.result || {};


      closeReceive();


      alert(

        'Stock received successfully.' +

        (
          transaction.transactionId
            ? '\n\nTransaction: ' +
              transaction.transactionId
            : ''
        ) +

        (
          transaction.availableAfter !==
          undefined
            ? '\nAvailable stock: ' +
              transaction.availableAfter
            : ''
        )

      );


      /*
        Automatically refresh
        stock after successful receipt.
      */

      lookupInventory(
        item.itemId
      );

    }

  );

}



/* =========================================================
   STOCK THRESHOLD
========================================================= */


function renderThreshold(
  available,
  threshold
) {


  const box =
    document
      .getElementById(
        'stockLevel'
      );


  if (!threshold) {

    box.classList.add(
      'hidden'
    );

    return;

  }


  box.classList.remove(
    'hidden'
  );


  if (
    threshold.criticalLevel &&
    available <=
      threshold.criticalLevel
  ) {

    box.className =
      'level level-critical';


    box.textContent =

      '⚠ Critical stock level. ' +

      'Available: ' +
      available +

      ' • Critical: ' +
      threshold.criticalLevel;


    return;

  }


  if (
    threshold.reorderLevel &&
    available <=
      threshold.reorderLevel
  ) {

    box.className =
      'level level-reorder';


    box.textContent =

      '⚠ Reorder level reached. ' +

      'Available: ' +
      available +

      ' • Reorder at: ' +
      threshold.reorderLevel;


    return;

  }


  box.className =
    'level level-good';


  box.textContent =
    '✓ Stock level is within configured threshold.';

}



/* =========================================================
   BATCH DISPLAY
========================================================= */


function renderBatches(
  batches
) {


  const container =
    document
      .getElementById(
        'batchContainer'
      );


  if (
    !batches ||
    !batches.length
  ) {

    container.innerHTML =

      '<div class="batch-heading">' +
      'BATCH INVENTORY' +
      '</div>' +

      '<div class="batch">' +
      'No inventory batches.' +
      '</div>';


    return;

  }


  let html =

    '<div class="batch-heading">' +
    'BATCH INVENTORY • FEFO' +
    '</div>';


  batches.forEach(
    function(batch) {


      html += `

        <div class="batch">

          <b>
            ${escapeHtml(
              batch.batchNo ||
              'No Batch'
            )}
          </b>

          <br>

          Expiry:
          ${escapeHtml(
            batch.expiryDate ||
            'N/A'
          )}

          <br>

          Available:
          <b>
            ${batch.qtyAvailable}
          </b>

          &nbsp; • &nbsp;

          Quarantine:
          <b>
            ${batch.qtyQuarantined}
          </b>

          <br>

          Location:
          ${escapeHtml(
            batch.locationId ||
            '-'
          )}

          ${
            batch.unitCost
              ? '<br>Unit Cost: ₱' +
                Number(
                  batch.unitCost
                ).toFixed(2)
              : ''
          }

        </div>

      `;

    }
  );


  container.innerHTML =
    html;

}



/* =========================================================
   SCAN ANOTHER
========================================================= */


function scanAnother() {


  closeReceive();


  document
    .getElementById(
      'itemCard'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'manualCode'
    )
    .value = '';


  currentItemResult =
    null;


  scanLocked =
    false;


  openScanner();

}



/* =========================================================
   JSONP API
========================================================= */


function apiCall(
  action,
  params,
  callback
) {


  const callbackName =

    'ims_' +

    Date.now() +

    '_' +

    Math.floor(
      Math.random() *
      100000
    );


  const script =
    document
      .createElement(
        'script'
      );


  let completed =
    false;


  const timeout =
    setTimeout(
      function() {


        if (completed) {

          return;

        }


        completed =
          true;


        cleanup();


        hideLoading();


        callback({

          success:
            false,

          message:
            'IMS API timed out.'

        });

      },
      20000
    );


  function cleanup() {


    clearTimeout(
      timeout
    );


    try {

      delete window[
        callbackName
      ];

    }

    catch (error) {}


    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }

  }


  window[
    callbackName
  ] =
    function(result) {


      if (completed) {

        return;

      }


      completed =
        true;


      cleanup();


      callback(
        result
      );

  };


  const query =
    new URLSearchParams();


  query.set(
    'action',
    action
  );


  Object.keys(
    params || {}
  ).forEach(
    function(key) {


      const value =
        params[key];


      if (
        value !== null &&
        typeof value !==
          'undefined'
      ) {

        query.set(
          key,
          String(value)
        );

      }

    }
  );


  query.set(
    'callback',
    callbackName
  );


  /*
    Prevent browser caching.
  */

  query.set(
    '_',
    Date.now()
  );


  script.src =

    API_URL +

    '?' +

    query.toString();


  script.onerror =
    function() {


      if (completed) {

        return;

      }


      completed =
        true;


      cleanup();


      hideLoading();


      callback({

        success:
          false,

        message:
          'Unable to reach IMS API.'

      });

    };


  document.body
    .appendChild(
      script
    );

}



/* =========================================================
   HELPERS
========================================================= */


function generateRequestId() {


  if (
    window.crypto &&
    crypto.randomUUID
  ) {

    return (
      'RCV-' +
      crypto.randomUUID()
    );

  }


  return (

    'RCV-' +

    Date.now() +

    '-' +

    Math.random()
      .toString(36)
      .slice(2)

  );

}


function sessionExpired() {


  hideLoading();


  clearSession();


  alert(
    'Your session expired. Please sign in again.'
  );


  location.reload();

}


function showStatus(
  message,
  type
) {


  const box =
    document
      .getElementById(
        'statusBox'
      );


  box.className =
    'status ' +
    (
      type || 'info'
    );


  box.innerHTML =
    message;

}


function showLoading(
  message
) {


  document
    .getElementById(
      'loadingText'
    )
    .textContent =
      message ||
      'Loading...';


  document
    .getElementById(
      'loading'
    )
    .classList.remove(
      'hidden'
    );

}


function hideLoading() {


  document
    .getElementById(
      'loading'
    )
    .classList.add(
      'hidden'
    );

}


function escapeHtml(
  value
) {


  return String(
    value || ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}
