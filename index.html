<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>MHSI Inventory Scanner</title>

<script
  src="https://accounts.google.com/gsi/client"
  async
  defer>
</script>

<script
  src="https://unpkg.com/@zxing/browser@latest">
</script>


<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  background: #f3f6fb;
  color: #172033;
}

.header {
  background:
    linear-gradient(
      135deg,
      #1555b6,
      #3277df
    );
  color: white;
  padding: 25px 20px;
}

.header h1 {
  margin: 0;
  font-size: 24px;
}

.header p {
  margin: 6px 0 0;
  opacity: .9;
  font-size: 13px;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 16px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow:
    0 4px 18px rgba(0,0,0,.055);
}

.hidden {
  display: none !important;
}

.status {
  padding: 13px 15px;
  border-radius: 13px;
  margin-bottom: 15px;
  font-size: 13px;
  line-height: 1.5;
}

.info {
  background: #edf4ff;
  color: #2459a9;
}

.success {
  background: #e8f7ee;
  color: #166534;
}

.error {
  background: #fff0f0;
  color: #b42318;
}

.warning {
  background: #fff7e8;
  color: #945b00;
}

.login-card {
  text-align: center;
  padding: 32px 20px;
}

.login-icon {
  font-size: 50px;
}

.login-title {
  margin-top: 10px;
  font-size: 22px;
  font-weight: 800;
}

.login-text {
  margin: 8px 0 20px;
  color: #667085;
  font-size: 13px;
}

#googleButton {
  display: flex;
  justify-content: center;
}

.user-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.user-name {
  font-size: 18px;
  font-weight: 800;
}

.user-meta {
  margin-top: 4px;
  color: #667085;
  font-size: 12px;
  line-height: 1.5;
}

.permission-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.permission {
  background: #edf4ff;
  color: #2764c5;
  padding: 6px 9px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 800;
}

.camera-shell {
  position: relative;
  overflow: hidden;
  background: #111;
  border-radius: 16px;
}

#video {
  display: block;
  width: 100%;
  height: 330px;
  object-fit: cover;
}

.scan-frame {
  position: absolute;
  left: 7%;
  right: 7%;
  top: 34%;
  height: 32%;
  border:
    2px solid rgba(255,255,255,.9);
  border-radius: 12px;
}

.scan-line {
  position: absolute;
  left: 10%;
  right: 10%;
  top: 50%;
  height: 2px;
  background: white;
}

button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 14px 16px;
  margin-top: 10px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
}

.primary {
  background: #2d6ed5;
  color: white;
}

.secondary {
  background: #edf4ff;
  color: #2764c5;
}

.receive {
  background: #15805b;
  color: white;
}

.issue {
  background: #e07b15;
  color: white;
}

.logout {
  width: auto;
  margin: 0;
  padding: 10px 13px;
  background: #fff0f0;
  color: #b42318;
}

input,
select,
textarea {
  width: 100%;
  border: 1px solid #d7dee8;
  border-radius: 12px;
  padding: 13px;
  margin-bottom: 13px;
  font-size: 16px;
  background: white;
}

label {
  display: block;
  margin-bottom: 5px;
  color: #667085;
  font-size: 12px;
  font-weight: 800;
}

.manual-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px;
}

.manual-row input,
.manual-row button {
  margin: 0;
}

.manual-row button {
  width: auto;
  min-width: 90px;
}

.item-code {
  color: #687386;
  font-size: 12px;
  font-weight: 700;
}

.item-name {
  margin-top: 5px;
  font-size: 23px;
  font-weight: 800;
}

.item-details {
  margin-top: 11px;
  color: #667085;
  font-size: 13px;
  line-height: 1.7;
}

.stock-grid {
  display: grid;
  grid-template-columns:
    repeat(3,1fr);
  gap: 8px;
  margin-top: 16px;
}

.stock-box {
  background: #f5f8fc;
  border-radius: 14px;
  padding: 14px 5px;
  text-align: center;
}

.stock-number {
  color: #2868c9;
  font-size: 23px;
  font-weight: 800;
}

.stock-label {
  margin-top: 3px;
  color: #697386;
  font-size: 9px;
  font-weight: 800;
}

.batch-heading {
  margin-top: 19px;
  color: #687386;
  font-size: 11px;
  font-weight: 800;
}

.batch {
  padding: 11px 0;
  border-top: 1px solid #edf0f4;
  font-size: 12px;
  line-height: 1.6;
}

.level {
  margin-top: 14px;
  border-radius: 12px;
  padding: 12px;
  font-size: 12px;
  font-weight: 700;
}

.level-good {
  background: #ebf8ef;
  color: #166534;
}

.level-reorder {
  background: #fff7e8;
  color: #945b00;
}

.level-critical {
  background: #fff0f0;
  color: #b42318;
}

.form-title {
  font-size: 21px;
  font-weight: 800;
}

.form-item {
  margin: 5px 0 18px;
  color: #667085;
  font-size: 13px;
}

.fefo-note {
  padding: 12px;
  margin-bottom: 15px;
  background: #fff7e8;
  color: #945b00;
  border-radius: 12px;
  font-size: 12px;
  line-height: 1.5;
}

.loading {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: rgba(255,255,255,.93);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #2868c9;
  font-weight: 800;
}

.spinner {
  width: 38px;
  height: 38px;
  border: 4px solid #dce8f8;
  border-top-color: #2868c9;
  border-radius: 50%;
  margin-bottom: 12px;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

</style>

</head>


<body>


<div
  id="loading"
  class="loading hidden">

  <div class="spinner"></div>

  <div id="loadingText">
    Loading...
  </div>

</div>


<header class="header">

  <h1>
    MHSI Inventory Scanner
  </h1>

  <p>
    Secure Inventory Management
  </p>

</header>


<main class="container">


<div
  id="loginCard"
  class="card login-card">

  <div class="login-icon">
    🔐
  </div>

  <div class="login-title">
    Sign in to IMS
  </div>

  <div class="login-text">
    Use your authorized MHSI Google account.
  </div>

  <div id="googleButton"></div>

</div>


<div
  id="appArea"
  class="hidden">


<div class="card">

  <div class="user-top">

    <div>

      <div
        id="userName"
        class="user-name">
      </div>

      <div
        id="userMeta"
        class="user-meta">
      </div>

    </div>

    <button
      class="logout"
      onclick="logout()">
      LOG OUT
    </button>

  </div>

  <div
    id="permissionList"
    class="permission-list">
  </div>

</div>


<div
  id="statusBox"
  class="status info">
  Ready to scan.
</div>


<div class="card">

  <div class="camera-shell">

    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>

    <div class="scan-frame"></div>

    <div class="scan-line"></div>

  </div>

  <button
    id="openButton"
    class="primary"
    onclick="openScanner()">
    OPEN SCANNER
  </button>

  <button
    id="stopButton"
    class="secondary hidden"
    onclick="stopScanner()">
    STOP SCANNER
  </button>

</div>


<div class="card">

  <div
    style="
      font-size:11px;
      font-weight:800;
      color:#687386;
      margin-bottom:8px;
    ">
    MANUAL SEARCH
  </div>

  <div class="manual-row">

    <input
      id="manualCode"
      placeholder="Barcode / Item ID">

    <button
      class="primary"
      onclick="manualLookup()">
      SEARCH
    </button>

  </div>

</div>


<div
  id="itemCard"
  class="card hidden">

  <div
    id="itemCode"
    class="item-code">
  </div>

  <div
    id="itemName"
    class="item-name">
  </div>

  <div
    id="itemDetails"
    class="item-details">
  </div>


  <div class="stock-grid">

    <div class="stock-box">

      <div
        id="availableStock"
        class="stock-number">
        0
      </div>

      <div class="stock-label">
        AVAILABLE
      </div>

    </div>


    <div class="stock-box">

      <div
        id="quarantineStock"
        class="stock-number">
        0
      </div>

      <div class="stock-label">
        QUARANTINE
      </div>

    </div>


    <div class="stock-box">

      <div
        id="transitStock"
        class="stock-number">
        0
      </div>

      <div class="stock-label">
        IN TRANSIT
      </div>

    </div>

  </div>


  <div
    id="stockLevel"
    class="level hidden">
  </div>


  <div id="batchContainer"></div>


  <button
    id="receiveButton"
    class="receive hidden"
    onclick="openReceive()">
    + RECEIVE STOCK
  </button>


  <button
    id="issueButton"
    class="issue hidden"
    onclick="openIssue()">
    − ISSUE STOCK
  </button>


  <button
    class="primary"
    onclick="scanAnother()">
    SCAN ANOTHER ITEM
  </button>

</div>


<!-- RECEIVE -->

<div
  id="receiveCard"
  class="card hidden">

  <div class="form-title">
    Receive Stock
  </div>

  <div
    id="receiveItemName"
    class="form-item">
  </div>

  <label>Quantity *</label>

  <input
    id="receiveQty"
    type="number"
    min="0.01"
    step="0.01">

  <label>
    Batch / Lot Number
    <span id="batchRequired"></span>
  </label>

  <input
    id="receiveBatch">

  <label>
    Expiry Date
    <span id="expiryRequired"></span>
  </label>

  <input
    id="receiveExpiry"
    type="date">

  <label>
    Storage Location *
  </label>

  <select id="receiveLocation">

    <option value="">
      Select location
    </option>

  </select>

  <label>
    Unit Cost
  </label>

  <input
    id="receiveUnitCost"
    type="number"
    min="0"
    step="0.01">

  <label>
    Reference No.
  </label>

  <input
    id="receiveReference">

  <label>
    Notes
  </label>

  <textarea
    id="receiveNotes"
    rows="3">
  </textarea>

  <button
    class="receive"
    onclick="submitReceive()">
    CONFIRM RECEIVE
  </button>

  <button
    class="secondary"
    onclick="closeReceive()">
    CANCEL
  </button>

</div>


<!-- ISSUE -->

<div
  id="issueCard"
  class="card hidden">

  <div class="form-title">
    Issue Stock
  </div>

  <div
    id="issueItemName"
    class="form-item">
  </div>


  <div
    id="fefoPreview"
    class="fefo-note">
  </div>


  <label>
    Quantity to Issue *
  </label>

  <input
    id="issueQty"
    type="number"
    min="0.01"
    step="0.01"
    inputmode="decimal">


  <label>
    Purpose / Reason
  </label>

  <input
    id="issueReason"
    value="Issuance"
    placeholder="e.g. Clinic consumption">


  <label>
    Reference No.
  </label>

  <input
    id="issueReference"
    placeholder="Request / Department / Reference">


  <label>
    Notes
  </label>

  <textarea
    id="issueNotes"
    rows="3">
  </textarea>


  <button
    class="issue"
    onclick="submitIssue()">
    CONFIRM ISSUE
  </button>


  <button
    class="secondary"
    onclick="closeIssue()">
    CANCEL
  </button>

</div>


</div>

</main>


<script>


const GOOGLE_CLIENT_ID =
  '717366343479-qjs60uj0gumr9m326phdtjp5kp0o6vrq.apps.googleusercontent.com';


const API_URL =
  'https://script.google.com/macros/s/AKfycbwSGG51EMk-47M9QqAfGUosXfslYvrq8MB6sSdVAO8NMFKL3YjzDsLXoLxsO-JvbMKwCA/exec';


let sessionToken =
  localStorage.getItem(
    'mhsi_ims_session'
  ) || '';


let currentUser = null;

let currentItemResult = null;

let locations = [];

let codeReader = null;

let controls = null;

let scannerRunning = false;

let scanLocked = false;



window.addEventListener(
  'load',
  initialize
);


function initialize() {

  if (sessionToken) {
    validateStoredSession();
  }


  const timer =
    setInterval(
      function() {

        if (
          window.google &&
          google.accounts &&
          google.accounts.id
        ) {

          clearInterval(timer);

          initializeGoogleLogin();

        }

      },
      100
    );

}


function initializeGoogleLogin() {

  google.accounts.id.initialize({

    client_id:
      GOOGLE_CLIENT_ID,

    callback:
      handleGoogleCredential,

    auto_select:
      false

  });


  google.accounts.id.renderButton(

    document.getElementById(
      'googleButton'
    ),

    {
      theme: 'outline',
      size: 'large',
      width: 280,
      text: 'signin_with'
    }

  );

}


function handleGoogleCredential(
  response
) {

  if (
    !response ||
    !response.credential
  ) {

    alert(
      'Google sign-in failed.'
    );

    return;

  }


  showLoading(
    'Verifying MHSI account...'
  );


  apiCall(

    'login',

    {
      credential:
        response.credential
    },

    function(result) {

      hideLoading();


      if (
        !result ||
        result.success !== true
      ) {

        alert(
          result &&
          result.message
            ? result.message
            : 'Access denied.'
        );

        return;

      }


      sessionToken =
        result.sessionToken;


      localStorage.setItem(
        'mhsi_ims_session',
        sessionToken
      );


      currentUser =
        result.user;


      openApp();

    }

  );

}


function validateStoredSession() {

  apiCall(

    'session',

    {
      session:
        sessionToken
    },

    function(result) {

      if (
        result &&
        result.success === true &&
        result.authenticated === true
      ) {

        currentUser =
          result.user;

        openApp();

      }

      else {

        clearSession();

      }

    }

  );

}


function openApp() {

  document
    .getElementById(
      'loginCard'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'appArea'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'userName'
    )
    .textContent =
      currentUser.fullName;


  document
    .getElementById(
      'userMeta'
    )
    .innerHTML =

      escapeHtml(
        currentUser.role
      ) +

      '<br>' +

      escapeHtml(
        currentUser.pccName ||
        currentUser.pccId
      ) +

      ' • ' +

      escapeHtml(
        currentUser.email
      );


  renderPermissions();

  loadLocations();


  showStatus(
    'Signed in successfully. Ready to scan.',
    'success'
  );

}


function renderPermissions() {

  const p =
    currentUser.permissions || {};


  const labels = [];


  if (p.receive) {
    labels.push(
      'RECEIVE'
    );
  }

  if (p.issue) {
    labels.push(
      'ISSUE'
    );
  }

  if (p.transfer) {
    labels.push(
      'TRANSFER'
    );
  }

  if (p.count) {
    labels.push(
      'COUNT'
    );
  }


  document
    .getElementById(
      'permissionList'
    )
    .innerHTML =

      labels.map(
        function(label) {

          return (
            '<span class="permission">' +
            escapeHtml(label) +
            '</span>'
          );

        }
      )
      .join('');

}


function logout() {

  stopScanner();


  apiCall(
    'logout',
    {
      session:
        sessionToken
    },
    function() {}
  );


  try {
    google.accounts.id
      .disableAutoSelect();
  }
  catch (error) {}


  clearSession();

  location.reload();

}


function clearSession() {

  sessionToken = '';

  currentUser = null;

  currentItemResult = null;


  localStorage.removeItem(
    'mhsi_ims_session'
  );

}


/* LOCATIONS */

function loadLocations() {

  apiCall(

    'locations',

    {
      session:
        sessionToken
    },

    function(result) {

      if (
        !result ||
        result.success !== true
      ) {
        return;
      }


      locations =
        result.locations || [];


      const select =
        document.getElementById(
          'receiveLocation'
        );


      select.innerHTML =
        '<option value="">Select location</option>';


      locations.forEach(
        function(location) {

          const option =
            document.createElement(
              'option'
            );


          option.value =
            location.locationId;


          option.textContent =
            location.locationName +
            (
              location.locationType
                ? ' • ' +
                  location.locationType
                : ''
            );


          select.appendChild(
            option
          );

        }
      );

    }

  );

}


/* CAMERA */

async function openScanner() {

  if (
    scannerRunning ||
    !sessionToken
  ) {
    return;
  }


  scanLocked = false;


  try {

    codeReader =
      new ZXingBrowser
        .BrowserMultiFormatReader();


    const devices =
      await ZXingBrowser
        .BrowserCodeReader
        .listVideoInputDevices();


    if (
      !devices ||
      !devices.length
    ) {

      throw new Error(
        'No camera detected.'
      );

    }


    let selected =
      devices[0];


    const rear =
      devices.find(
        function(device) {

          const label =
            String(
              device.label || ''
            )
            .toLowerCase();


          return (
            label.includes('back') ||
            label.includes('rear') ||
            label.includes('environment')
          );

        }
      );


    if (rear) {
      selected = rear;
    }


    controls =
      await codeReader
        .decodeFromVideoDevice(

          selected.deviceId,

          document.getElementById(
            'video'
          ),

          function(result) {

            if (
              result &&
              !scanLocked
            ) {

              const value =
                String(
                  result.getText()
                ).trim();


              if (value) {
                handleScannedCode(
                  value
                );
              }

            }

          }

        );


    scannerRunning = true;


    document
      .getElementById(
        'openButton'
      )
      .classList.add(
        'hidden'
      );


    document
      .getElementById(
        'stopButton'
      )
      .classList.remove(
        'hidden'
      );


    showStatus(
      'Camera ready.',
      'success'
    );

  }

  catch (error) {

    showStatus(
      error.message ||
      String(error),
      'error'
    );

  }

}


async function stopScanner() {

  try {

    if (controls) {
      controls.stop();
    }

  }
  catch (error) {}


  controls = null;

  codeReader = null;

  scannerRunning = false;


  const video =
    document.getElementById(
      'video'
    );


  if (
    video &&
    video.srcObject
  ) {

    video.srcObject
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );


    video.srcObject = null;

  }


  document
    .getElementById(
      'openButton'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'stopButton'
    )
    .classList.add(
      'hidden'
    );

}


async function handleScannedCode(
  value
) {

  if (scanLocked) {
    return;
  }


  scanLocked = true;


  if (navigator.vibrate) {
    navigator.vibrate(100);
  }


  await stopScanner();


  lookupInventory(
    value
  );

}


/* LOOKUP */

function manualLookup() {

  const value =
    document
      .getElementById(
        'manualCode'
      )
      .value
      .trim();


  if (!value) {

    showStatus(
      'Enter a Barcode or Item ID.',
      'error'
    );

    return;

  }


  lookupInventory(value);

}


function lookupInventory(
  code
) {

  showLoading(
    'Looking up inventory...'
  );


  apiCall(

    'lookup',

    {
      session:
        sessionToken,

      code:
        code
    },

    function(result) {

      hideLoading();


      if (
        !result ||
        result.success !== true
      ) {

        showStatus(
          result &&
          result.message
            ? result.message
            : 'IMS lookup failed.',
          'error'
        );

        scanLocked = false;

        return;

      }


      if (
        result.found !== true
      ) {

        document
          .getElementById(
            'itemCard'
          )
          .classList.add(
            'hidden'
          );


        showStatus(
          'Item not found in ITEM_MASTER.',
          'warning'
        );


        scanLocked = false;

        return;

      }


      currentItemResult =
        result;


      displayItem(result);


      scanLocked = false;

    }

  );

}


function displayItem(result) {

  const item =
    result.item;


  const inv =
    result.inventory;


  document
    .getElementById(
      'itemCard'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'itemCode'
    )
    .textContent =

      item.itemId +

      (
        item.barcode
          ? ' • ' +
            item.barcode
          : ''
      );


  document
    .getElementById(
      'itemName'
    )
    .textContent =
      item.itemName;


  document
    .getElementById(
      'itemDetails'
    )
    .innerHTML =

      'Category: <b>' +
      escapeHtml(
        item.category || '-'
      ) +
      '</b><br>' +

      'UOM: <b>' +
      escapeHtml(
        item.uom || '-'
      ) +
      '</b>';


  document
    .getElementById(
      'availableStock'
    )
    .textContent =
      inv.totalAvailable;


  document
    .getElementById(
      'quarantineStock'
    )
    .textContent =
      inv.totalQuarantined;


  document
    .getElementById(
      'transitStock'
    )
    .textContent =
      inv.totalInTransit;


  renderThreshold(
    inv.totalAvailable,
    result.threshold
  );


  renderBatches(
    inv.batches
  );


  document
    .getElementById(
      'receiveButton'
    )
    .classList.toggle(
      'hidden',
      !currentUser.permissions.receive
    );


  document
    .getElementById(
      'issueButton'
    )
    .classList.toggle(
      'hidden',
      !currentUser.permissions.issue
    );


  showStatus(
    'Item found.',
    'success'
  );


  document
    .getElementById(
      'itemCard'
    )
    .scrollIntoView({
      behavior: 'smooth'
    });

}


/* RECEIVE */

function openReceive() {

  const item =
    currentItemResult.item;


  clearReceiveForm();


  document
    .getElementById(
      'receiveItemName'
    )
    .textContent =
      item.itemName +
      ' • ' +
      item.itemId;


  document
    .getElementById(
      'batchRequired'
    )
    .textContent =
      item.requiresBatch
        ? '*'
        : '';


  document
    .getElementById(
      'expiryRequired'
    )
    .textContent =
      item.requiresExpiry
        ? '*'
        : '';


  if (
    currentItemResult.threshold &&
    currentItemResult.threshold
      .preferredLocationId
  ) {

    document
      .getElementById(
        'receiveLocation'
      )
      .value =
        currentItemResult
          .threshold
          .preferredLocationId;

  }


  document
    .getElementById(
      'receiveCard'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'receiveCard'
    )
    .scrollIntoView({
      behavior: 'smooth'
    });

}


function closeReceive() {

  document
    .getElementById(
      'receiveCard'
    )
    .classList.add(
      'hidden'
    );

}


function clearReceiveForm() {

  [
    'receiveQty',
    'receiveBatch',
    'receiveExpiry',
    'receiveUnitCost',
    'receiveReference',
    'receiveNotes'
  ].forEach(
    id => {
      document.getElementById(id).value = '';
    }
  );


  document
    .getElementById(
      'receiveLocation'
    )
    .value = '';

}


function submitReceive() {

  const item =
    currentItemResult.item;


  const quantity =
    Number(
      document.getElementById(
        'receiveQty'
      ).value
    );


  const batchNo =
    document.getElementById(
      'receiveBatch'
    ).value.trim();


  const expiryDate =
    document.getElementById(
      'receiveExpiry'
    ).value;


  const locationId =
    document.getElementById(
      'receiveLocation'
    ).value;


  const unitCost =
    Number(
      document.getElementById(
        'receiveUnitCost'
      ).value || 0
    );


  if (
    !quantity ||
    quantity <= 0
  ) {

    alert(
      'Enter a valid quantity.'
    );

    return;

  }


  if (
    item.requiresBatch &&
    !batchNo
  ) {

    alert(
      'Batch / Lot Number is required.'
    );

    return;

  }


  if (
    item.requiresExpiry &&
    !expiryDate
  ) {

    alert(
      'Expiry Date is required.'
    );

    return;

  }


  if (!locationId) {

    alert(
      'Select a storage location.'
    );

    return;

  }


  if (
    !confirm(
      'Receive ' +
      quantity +
      ' ' +
      (
        item.uom || ''
      ) +
      ' of ' +
      item.itemName +
      '?'
    )
  ) {
    return;
  }


  showLoading(
    'Receiving stock...'
  );


  apiCall(

    'receive',

    {
      session:
        sessionToken,

      requestId:
        generateRequestId(
          'RCV'
        ),

      itemId:
        item.itemId,

      quantity:
        quantity,

      batchNo:
        batchNo,

      expiryDate:
        expiryDate,

      locationId:
        locationId,

      unitCost:
        unitCost,

      referenceNo:
        document.getElementById(
          'receiveReference'
        ).value.trim(),

      notes:
        document.getElementById(
          'receiveNotes'
        ).value.trim()
    },

    function(result) {

      hideLoading();


      if (
        !result ||
        result.success !== true
      ) {

        alert(
          result &&
          result.message
            ? result.message
            : 'Receive failed.'
        );

        return;

      }


      closeReceive();


      alert(
        'Stock received successfully.\n\n' +
        'Transaction: ' +
        result.result.transactionId
      );


      lookupInventory(
        item.itemId
      );

    }

  );

}


/* ISSUE */

function openIssue() {

  const item =
    currentItemResult.item;


  document
    .getElementById(
      'issueItemName'
    )
    .textContent =
      item.itemName +
      ' • ' +
      item.itemId;


  document
    .getElementById(
      'issueQty'
    )
    .value = '';


  document
    .getElementById(
      'issueReason'
    )
    .value =
      'Issuance';


  document
    .getElementById(
      'issueReference'
    )
    .value = '';


  document
    .getElementById(
      'issueNotes'
    )
    .value = '';


  renderFefoPreview();


  document
    .getElementById(
      'issueCard'
    )
    .classList.remove(
      'hidden'
    );


  document
    .getElementById(
      'issueCard'
    )
    .scrollIntoView({
      behavior: 'smooth'
    });

}


function closeIssue() {

  document
    .getElementById(
      'issueCard'
    )
    .classList.add(
      'hidden'
    );

}


function renderFefoPreview() {

  const batches =
    (
      currentItemResult
        .inventory
        .batches || []
    )
    .filter(
      b =>
        Number(
          b.qtyAvailable || 0
        ) > 0
    );


  if (!batches.length) {

    document
      .getElementById(
        'fefoPreview'
      )
      .innerHTML =
        'No available stock.';

    return;

  }


  const first =
    batches[0];


  document
    .getElementById(
      'fefoPreview'
    )
    .innerHTML =

      '<b>FEFO:</b> The system will automatically issue from the earliest-expiring batch first.<br><br>' +

      'First batch: <b>' +
      escapeHtml(
        first.batchNo ||
        'No Batch'
      ) +
      '</b><br>' +

      'Expiry: ' +
      escapeHtml(
        first.expiryDate ||
        'N/A'
      ) +
      '<br>' +

      'Available: <b>' +
      first.qtyAvailable +
      '</b>';

}


function submitIssue() {

  const item =
    currentItemResult.item;


  const quantity =
    Number(
      document
        .getElementById(
          'issueQty'
        )
        .value
    );


  const available =
    Number(
      currentItemResult
        .inventory
        .totalAvailable || 0
    );


  if (
    !quantity ||
    quantity <= 0
  ) {

    alert(
      'Enter a valid quantity.'
    );

    return;

  }


  if (
    quantity >
    available
  ) {

    alert(
      'Insufficient stock.\n\n' +
      'Available: ' +
      available
    );

    return;

  }


  const reason =
    document
      .getElementById(
        'issueReason'
      )
      .value
      .trim();


  const confirmed =
    confirm(

      'Issue ' +
      quantity +
      ' ' +
      (
        item.uom || ''
      ) +
      ' of ' +
      item.itemName +
      '?\n\n' +

      'The system will use FEFO automatically.'

    );


  if (!confirmed) {
    return;
  }


  showLoading(
    'Issuing stock using FEFO...'
  );


  apiCall(

    'issue',

    {

      session:
        sessionToken,

      requestId:
        generateRequestId(
          'ISS'
        ),

      itemId:
        item.itemId,

      quantity:
        quantity,

      reason:
        reason ||
        'Issuance',

      referenceNo:
        document
          .getElementById(
            'issueReference'
          )
          .value
          .trim(),

      notes:
        document
          .getElementById(
            'issueNotes'
          )
          .value
          .trim()

    },

    function(result) {

      hideLoading();


      if (
        !result ||
        result.success !== true
      ) {

        alert(
          result &&
          result.message
            ? result.message
            : 'Issue transaction failed.'
        );

        return;

      }


      closeIssue();


      const r =
        result.result;


      let message =

        'Stock issued successfully.\n\n' +

        'Total issued: ' +
        r.totalIssued +

        '\nAvailable after: ' +
        r.availableAfter;


      if (
        r.deductions &&
        r.deductions.length
      ) {

        message +=
          '\n\nFEFO batches used:';


        r.deductions.forEach(
          function(batch) {

            message +=

              '\n• ' +

              (
                batch.batchNo ||
                batch.batchStockId
              ) +

              ': ' +

              batch.quantityIssued;

          }
        );

      }


      alert(message);


      lookupInventory(
        item.itemId
      );

    }

  );

}


/* DISPLAY */

function renderBatches(
  batches
) {

  const container =
    document.getElementById(
      'batchContainer'
    );


  if (
    !batches ||
    !batches.length
  ) {

    container.innerHTML =
      '<div class="batch-heading">BATCH INVENTORY</div>' +
      '<div class="batch">No inventory batches.</div>';

    return;

  }


  let html =
    '<div class="batch-heading">BATCH INVENTORY • FEFO</div>';


  batches.forEach(
    function(b) {

      html += `

        <div class="batch">

          <b>
            ${escapeHtml(
              b.batchNo ||
              'No Batch'
            )}
          </b>

          <br>

          Expiry:
          ${escapeHtml(
            b.expiryDate ||
            'N/A'
          )}

          <br>

          Available:
          <b>
            ${b.qtyAvailable}
          </b>

          • Quarantine:
          <b>
            ${b.qtyQuarantined}
          </b>

          <br>

          Location:
          ${escapeHtml(
            b.locationId ||
            '-'
          )}

        </div>

      `;

    }
  );


  container.innerHTML =
    html;

}


function renderThreshold(
  available,
  threshold
) {

  const box =
    document.getElementById(
      'stockLevel'
    );


  if (!threshold) {

    box.classList.add(
      'hidden'
    );

    return;

  }


  box.classList.remove(
    'hidden'
  );


  if (
    threshold.criticalLevel &&
    available <=
      threshold.criticalLevel
  ) {

    box.className =
      'level level-critical';

    box.textContent =
      '⚠ Critical stock level. Available: ' +
      available;

    return;

  }


  if (
    threshold.reorderLevel &&
    available <=
      threshold.reorderLevel
  ) {

    box.className =
      'level level-reorder';

    box.textContent =
      '⚠ Reorder level reached. Available: ' +
      available +
      ' • Reorder at: ' +
      threshold.reorderLevel;

    return;

  }


  box.className =
    'level level-good';

  box.textContent =
    '✓ Stock level is within configured threshold.';

}


function scanAnother() {

  closeReceive();

  closeIssue();


  document
    .getElementById(
      'itemCard'
    )
    .classList.add(
      'hidden'
    );


  document
    .getElementById(
      'manualCode'
    )
    .value = '';


  currentItemResult = null;

  scanLocked = false;


  openScanner();

}


/* JSONP */

function apiCall(
  action,
  params,
  callback
) {

  const callbackName =
    'ims_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() *
      100000
    );


  const script =
    document.createElement(
      'script'
    );


  let completed =
    false;


  const timeout =
    setTimeout(
      function() {

        if (completed) {
          return;
        }


        completed = true;

        cleanup();

        hideLoading();


        callback({
          success: false,
          message:
            'IMS API timed out.'
        });

      },
      20000
    );


  function cleanup() {

    clearTimeout(
      timeout
    );


    try {
      delete window[
        callbackName
      ];
    }
    catch (error) {}


    if (
      script.parentNode
    ) {

      script.parentNode
        .removeChild(
          script
        );

    }

  }


  window[
    callbackName
  ] =
    function(result) {

      if (completed) {
        return;
      }


      completed = true;

      cleanup();

      callback(result);

  };


  const query =
    new URLSearchParams();


  query.set(
    'action',
    action
  );


  Object.keys(
    params || {}
  ).forEach(
    function(key) {

      if (
        params[key] !== null &&
        typeof params[key] !==
          'undefined'
      ) {

        query.set(
          key,
          String(
            params[key]
          )
        );

      }

    }
  );


  query.set(
    'callback',
    callbackName
  );


  query.set(
    '_',
    Date.now()
  );


  script.src =
    API_URL +
    '?' +
    query.toString();


  script.onerror =
    function() {

      if (completed) {
        return;
      }


      completed = true;

      cleanup();

      hideLoading();


      callback({
        success: false,
        message:
          'Unable to reach IMS API.'
      });

  };


  document.body
    .appendChild(
      script
    );

}


/* HELPERS */

function generateRequestId(
  prefix
) {

  if (
    window.crypto &&
    crypto.randomUUID
  ) {

    return (
      prefix +
      '-' +
      crypto.randomUUID()
    );

  }


  return (
    prefix +
    '-' +
    Date.now() +
    '-' +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


function showStatus(
  message,
  type
) {

  const box =
    document.getElementById(
      'statusBox'
    );


  box.className =
    'status ' +
    (
      type ||
      'info'
    );


  box.innerHTML =
    message;

}


function showLoading(
  message
) {

  document
    .getElementById(
      'loadingText'
    )
    .textContent =
      message ||
      'Loading...';


  document
    .getElementById(
      'loading'
    )
    .classList.remove(
      'hidden'
    );

}


function hideLoading() {

  document
    .getElementById(
      'loading'
    )
    .classList.add(
      'hidden'
    );

}


function escapeHtml(
  value
) {

  return String(
    value || ''
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}
