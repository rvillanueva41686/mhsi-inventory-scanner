<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <title>MHSI Inventory Scanner</title>

  <script src="https://unpkg.com/@zxing/browser@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172033;
    }

    .header {
      background: linear-gradient(135deg, #1555b6, #3277df);
      color: white;
      padding: 26px 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      margin: 7px 0 0;
      opacity: .9;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
    }

    .camera-shell {
      background: #111;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
    }

    video {
      width: 100%;
      min-height: 280px;
      max-height: 420px;
      object-fit: cover;
      display: block;
      background: #111;
    }

    .scan-line {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 50%;
      height: 2px;
      background: rgba(255,255,255,.9);
      pointer-events: none;
    }

    .scan-box {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 30%;
      height: 40%;
      border: 2px solid rgba(255,255,255,.85);
      border-radius: 12px;
      pointer-events: none;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 800;
      margin-top: 10px;
      cursor: pointer;
    }

    .primary {
      background: #2d6ed5;
      color: white;
    }

    .secondary {
      background: #edf4ff;
      color: #2764c5;
    }

    .danger {
      background: #fff0f0;
      color: #b42318;
    }

    .status {
      padding: 13px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-size: 13px;
      line-height: 1.5;
    }

    .info {
      background: #edf4ff;
      color: #2459a9;
    }

    .success {
      background: #e8f7ee;
      color: #166534;
    }

    .error {
      background: #fff0f0;
      color: #b42318;
    }

    .result-label {
      font-size: 11px;
      color: #687386;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .result-code {
      font-size: 22px;
      font-weight: 800;
      word-break: break-word;
    }

    .result-format {
      margin-top: 8px;
      font-size: 13px;
      color: #687386;
    }

    .hidden {
      display: none;
    }

    input {
      width: 100%;
      border: 1px solid #d7dee8;
      border-radius: 12px;
      padding: 13px;
      font-size: 16px;
      margin-top: 8px;
    }

    .tip {
      font-size: 12px;
      line-height: 1.5;
      color: #667085;
      margin-top: 12px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>MHSI Inventory Scanner</h1>
    <p>ZXing Barcode & QR Scanner</p>
  </div>

  <div class="container">

    <div id="statusBox" class="status info">
      Tap OPEN SCANNER to begin.
    </div>

    <div class="card">

      <div class="camera-shell">

        <video
          id="video"
          autoplay
          muted
          playsinline>
        </video>

        <div class="scan-box"></div>
        <div class="scan-line"></div>

      </div>

      <button
        id="openButton"
        class="primary"
        onclick="openScanner()">
        OPEN SCANNER
      </button>

      <button
        id="stopButton"
        class="secondary hidden"
        onclick="stopScanner()">
        STOP SCANNER
      </button>

      <div class="tip">
        For 1D barcodes, hold the phone horizontally if needed and keep the full barcode inside the box. Avoid glare and move slightly closer or farther until the bars are sharp.
      </div>

    </div>

    <div
      id="resultCard"
      class="card hidden">

      <div class="result-label">
        SCANNED VALUE
      </div>

      <div
        id="scannedValue"
        class="result-code">
      </div>

      <div
        id="scannedFormat"
        class="result-format">
      </div>

      <button
        class="primary"
        onclick="scanAgain()">
        SCAN ANOTHER ITEM
      </button>

    </div>

    <div class="card">

      <div class="result-label">
        MANUAL CODE
      </div>

      <input
        id="manualCode"
        type="text"
        placeholder="Barcode / Item ID">

      <button
        class="secondary"
        onclick="manualTest()">
        USE CODE
      </button>

    </div>

  </div>

<script>

let codeReader = null;
let controls = null;
let scannerRunning = false;
let scanLocked = false;


/* =====================================
   STATUS
===================================== */

function showStatus(message, type) {

  const box =
    document.getElementById('statusBox');

  box.className =
    'status ' + type;

  box.innerHTML =
    message;
}


/* =====================================
   OPEN SCANNER
===================================== */

async function openScanner() {

  if (scannerRunning) {
    return;
  }

  try {

    showStatus(
      'Requesting camera...',
      'info'
    );


    codeReader =
      new ZXingBrowser.BrowserMultiFormatReader();


    const devices =
      await ZXingBrowser
        .BrowserCodeReader
        .listVideoInputDevices();


    if (
      !devices ||
      devices.length === 0
    ) {

      throw new Error(
        'No camera detected.'
      );
    }


    /*
      Prefer rear/back camera
    */

    let selectedDevice =
      devices[0];


    const rear =
      devices.find(
        device => {

          const label =
            String(
              device.label || ''
            ).toLowerCase();

          return (
            label.includes('back') ||
            label.includes('rear') ||
            label.includes('environment')
          );
        }
      );


    if (rear) {
      selectedDevice = rear;
    }


    const video =
      document.getElementById('video');


    scanLocked = false;


    controls =
      await codeReader
        .decodeFromVideoDevice(

          selectedDevice.deviceId,

          video,

          function(
            result,
            error,
            control
          ) {

            if (
              result &&
              !scanLocked
            ) {

              handleResult(
                result
              );

            }

          }

        );


    scannerRunning = true;


    document
      .getElementById('openButton')
      .classList
      .add('hidden');


    document
      .getElementById('stopButton')
      .classList
      .remove('hidden');


    showStatus(
      'Camera ready. Point at a barcode or QR code.',
      'success'
    );

  }

  catch (error) {

    console.error(error);

    scannerRunning = false;

    showStatus(
      'Scanner error:<br><b>' +
      (error.name || 'Error') +
      '</b><br>' +
      (error.message || error),
      'error'
    );
  }
}


/* =====================================
   RESULT
===================================== */

async function handleResult(
  result
) {

  if (scanLocked) {
    return;
  }


  scanLocked = true;


  const text =
    String(
      result.getText
        ? result.getText()
        : result.text || ''
    ).trim();


  if (!text) {

    scanLocked = false;

    return;
  }


  let format = 'Unknown';


  try {

    if (
      result.getBarcodeFormat
    ) {

      format =
        String(
          result.getBarcodeFormat()
        );

    }

  }
  catch (e) {}


  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      120
    );

  }


  document
    .getElementById(
      'scannedValue'
    )
    .textContent =
      text;


  document
    .getElementById(
      'scannedFormat'
    )
    .textContent =
      'Format: ' + format;


  document
    .getElementById(
      'resultCard'
    )
    .classList
    .remove('hidden');


  showStatus(
    '✅ Barcode detected successfully.',
    'success'
  );


  await stopScanner();


  document
    .getElementById(
      'resultCard'
    )
    .scrollIntoView({
      behavior: 'smooth',
      block: 'start'
    });
}


/* =====================================
   STOP SCANNER
===================================== */

async function stopScanner() {

  try {

    if (controls) {

      controls.stop();

    }

  }

  catch (error) {

    console.log(error);

  }


  controls = null;
  codeReader = null;

  scannerRunning = false;


  const video =
    document.getElementById('video');


  if (
    video &&
    video.srcObject
  ) {

    video.srcObject
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    video.srcObject =
      null;

  }


  document
    .getElementById('openButton')
    .classList
    .remove('hidden');


  document
    .getElementById('stopButton')
    .classList
    .add('hidden');
}


/* =====================================
   SCAN AGAIN
===================================== */

async function scanAgain() {

  document
    .getElementById(
      'resultCard'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'scannedValue'
    )
    .textContent = '';


  document
    .getElementById(
      'scannedFormat'
    )
    .textContent = '';


  scanLocked = false;


  await openScanner();
}


/* =====================================
   MANUAL
===================================== */

function manualTest() {

  const value =
    document
      .getElementById(
        'manualCode'
      )
      .value
      .trim();


  if (!value) {

    showStatus(
      'Enter a code first.',
      'error'
    );

    return;
  }


  document
    .getElementById(
      'scannedValue'
    )
    .textContent =
      value;


  document
    .getElementById(
      'scannedFormat'
    )
    .textContent =
      'Format: Manual Entry';


  document
    .getElementById(
      'resultCard'
    )
    .classList
    .remove('hidden');


  showStatus(
    'Manual code accepted.',
    'success'
  );
}

</script>

</body>
</html>
