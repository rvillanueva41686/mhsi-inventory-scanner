<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1,
    maximum-scale=1, user-scalable=no">

  <title>MHSI Inventory Scanner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f6fb;
      font-family: Arial, sans-serif;
      color: #182033;
    }

    .header {
      background: #2864c7;
      color: white;
      padding: 28px 22px;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
    }

    .header p {
      margin: 8px 0 0;
      opacity: .9;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
    }

    #video {
      width: 100%;
      min-height: 280px;
      background: #111;
      border-radius: 16px;
      object-fit: cover;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      margin-top: 15px;

      background: #316bd5;
      color: white;

      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 15px;
      padding: 14px;
      border-radius: 12px;
      background: #edf3ff;
      text-align: center;
      line-height: 1.5;
    }

    .success {
      background: #e7f7ed !important;
    }

    .error {
      background: #fdeaea !important;
      color: #a52b20;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>MHSI Inventory Scanner</h1>
    <p>Camera Test</p>
  </div>

  <div class="container">

    <div class="card">

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>

      <button onclick="startCamera()">
        OPEN CAMERA
      </button>

      <button onclick="switchCamera()">
        SWITCH CAMERA
      </button>

      <div id="status">
        Press OPEN CAMERA to begin.
      </div>

    </div>

  </div>


<script>

let stream = null;

let facingMode = "environment";


async function startCamera() {

  const status =
    document.getElementById("status");

  const video =
    document.getElementById("video");

  status.className = "";

  status.innerHTML =
    "Requesting camera permission...";


  try {

    if (stream) {

      stream
        .getTracks()
        .forEach(track =>
          track.stop()
        );

    }


    stream =
      await navigator.mediaDevices
        .getUserMedia({

          audio: false,

          video: {

            facingMode: {
              ideal: facingMode
            }

          }

        });


    video.srcObject = stream;

    await video.play();


    status.className = "success";

    status.innerHTML =
      "✅ Camera opened successfully.<br>" +
      "Ready for barcode scanner.";

  }

  catch (error) {

    console.error(error);

    status.className = "error";

    status.innerHTML =
      "❌ Camera error:<br><br>" +
      error.name +
      "<br>" +
      error.message;

  }

}



async function switchCamera() {

  if (
    facingMode === "environment"
  ) {

    facingMode = "user";

  }

  else {

    facingMode = "environment";

  }


  await startCamera();

}

</script>

</body>
</html>
